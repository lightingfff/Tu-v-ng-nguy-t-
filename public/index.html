<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1020">
  <title>Tinh Vực · Vọng Nguyệt</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preload" as="image" href="/assets/ha-nguyet.webp">
</head>
<body>
  <main class="layout">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <div><h1>Tinh Vực <span>·</span> Vọng Nguyệt</h1><p>Biên niên sử Nguyệt Hồ</p></div>
      </div>
      <div class="header-actions">
        <div id="connection" class="presence" data-state="connecting" role="status">Đang kết nối</div>
        <button id="view-scene" class="view-button" type="button" aria-controls="world">Xem cảnh</button>
      </div>
    </header>
    <section class="scene" aria-label="Làng Hạ Nguyệt">
      <canvas id="world" width="1536" height="1024" aria-label="Quảng trường làng Hạ Nguyệt. Dùng WASD hoặc phím mũi tên để đi, E để tương tác."></canvas>
      <div class="location"><span>NGUYỆT HỒ</span><h2>Làng Hạ Nguyệt</h2></div>
      <aside class="quest" aria-label="Nhiệm vụ" aria-live="polite">
        <div class="quest-title"><span aria-hidden="true">✧</span><h3>Ánh sáng trở về</h3></div>
        <p id="objective">Gặp Người giữ đền ở quảng trường.</p>
        <div id="progress" class="progress" hidden>
          <span id="shard-icons" class="shards" aria-hidden="true">◇ ◇ ◇</span>
          <span id="count"></span>
        </div>
      </aside>
      <div class="scene-actions">
        <p id="notice" class="notice" aria-live="polite" hidden></p>
        <button id="interact" class="interact" type="button" hidden><kbd>E</kbd> <span></span></button>
      </div>
    </section>
    <footer class="footer">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> hoặc chạm để đi</span>
      <span><kbd>E</kbd> Tương tác</span>
      <span id="experience">Cấp 1 · 0 KN</span>
    </footer>
  </main>
  <script type="module" src="/game.js"></script>
</body>
</html>
